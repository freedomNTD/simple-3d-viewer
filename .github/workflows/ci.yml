name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: simple-3d-viewer-windows-x64.exe
            bin: simple-3d-viewer.exe
          - os: ubuntu-latest
            artifact: simple-3d-viewer-linux-x64
            bin: simple-3d-viewer
          - os: macos-latest
            artifact: simple-3d-viewer-macos-arm64
            bin: simple-3d-viewer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Test
        # parse-level regression tests (no GPU needed), incl. the textured-GLB
        # guard — v0.3.0 shipped unable to open any GLB with embedded textures
        run: cargo test --release

      - name: Rename artifact
        shell: bash
        run: cp "target/release/${{ matrix.bin }}" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
