[package]
name = "glb-peek"
version = "0.1.0"
edition = "2021"
description = "A tiny GLB/glTF viewer written in Rust — double-click a model, orbit around, done."
license = "MIT"
repository = "https://github.com/freedomNTD/glb-peek"
keywords = ["gltf", "glb", "viewer", "3d", "wgpu"]
categories = ["graphics", "rendering", "command-line-utilities"]

[dependencies]
three-d = "0.19"
three-d-asset = { version = "0.10", features = ["gltf"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = "thin"
